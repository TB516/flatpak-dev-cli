[tools]
go = "1.27.1"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w ."

[tasks.check]
description = "Check formatting and run Go checks"
run = '''
set -eu;
unformatted=$(gofmt -l .);
if [ -n "$unformatted" ]; then
  printf 'Unformatted Go files:\n%s\n' "$unformatted";
  exit 1;
fi;
go vet ./...;
go test ./...;
'''

[tasks.build]
description = "Build the CLI into bin/"
run = '''
set -eu;
mkdir -p bin;
CGO_ENABLED=0 go build -trimpath -ldflags="-X main.version=${FLATPAK_DEV_VERSION:-dev}" -o bin/flatpak-dev ./cmd/flatpak-dev;
'''
