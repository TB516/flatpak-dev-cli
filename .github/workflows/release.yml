name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.13"
      - name: Validate version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must have the form 0.1.0, without a v prefix.' >&2;
            exit 1;
          fi;
          existing_tag=$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION");
          if [ -n "$existing_tag" ]; then
            echo "Tag v$RELEASE_VERSION already exists; choose a new version." >&2;
            exit 1;
          fi;
      - name: Check
        run: mise run check
      - name: Build release archives
        run: |
          mkdir -p dist;
          for architecture in amd64 arm64; do
            GOOS=linux GOARCH="$architecture" FLATPAK_DEV_VERSION="$RELEASE_VERSION" mise run build;
            tar -czf "dist/flatpak-dev_${RELEASE_VERSION}_linux_${architecture}.tar.gz" -C bin flatpak-dev;
          done;
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --generate-notes;
